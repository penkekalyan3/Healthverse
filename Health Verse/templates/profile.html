<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | HealthVerse</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="overlay">

<div class="container">

<h1>👤 My Profile</h1>

<p class="subtitle">
Manage your personal health information.
</p>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="flash-message {{ category }}" style="background: {% if category == 'success' %}rgba(124, 252, 0, 0.2){% else %}rgba(255, 0, 0, 0.2){% endif %}; border: 1px solid {% if category == 'success' %}rgba(124, 252, 0, 0.4){% else %}rgba(255, 0, 0, 0.4){% endif %}; border-radius: 8px; color: white; padding: 10px; margin-bottom: 20px; font-size: 14px; text-align: center; width: 100%;">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
{% endwith %}

<form action="{{ url_for('profile') }}" method="POST">

<div class="form-grid">

<div class="input-box">
<label>Full Name</label>
<input type="text" name="fullname" value="{{ user.fullname }}" required>
</div>

<div class="input-box">
<label>Email</label>
<input type="email" name="email" value="{{ user.email }}" readonly style="opacity: 0.7; cursor: not-allowed;">
</div>

<div class="input-box">
<label>Age</label>
<input type="number" name="age" value="{{ profile.age if profile else '' }}" required>
</div>

<div class="input-box">
<label>Gender</label>
<select name="gender">
<option value="Female" {% if profile and profile.gender == 'Female' %}selected{% endif %}>Female</option>
<option value="Male" {% if profile and profile.gender == 'Male' %}selected{% endif %}>Male</option>
<option value="Other" {% if profile and profile.gender == 'Other' %}selected{% endif %}>Other</option>
</select>
</div>

<div class="input-box">
<label>Height (cm)</label>
<input type="number" step="any" name="height" value="{{ profile.height if profile else '' }}" required>
</div>

<div class="input-box">
<label>Weight (kg)</label>
<input type="number" step="any" name="weight" value="{{ profile.weight if profile else '' }}" required>
</div>

<div class="input-box">
<label>Fitness Goal</label>
<select name="goal">
<option value="Weight Loss" {% if profile and profile.goal == 'Weight Loss' %}selected{% endif %}>Weight Loss</option>
<option value="Weight Gain" {% if profile and profile.goal == 'Weight Gain' %}selected{% endif %}>Weight Gain</option>
<option value="Maintain Fitness" {% if profile and profile.goal == 'Maintain Fitness' %}selected{% endif %}>Maintain Fitness</option>
<option value="Build Muscle" {% if profile and profile.goal == 'Build Muscle' %}selected{% endif %}>Build Muscle</option>
</select>
</div>

<div class="input-box">
<label>Activity Level</label>
<select name="activity_level">
<option value="Beginner" {% if profile and profile.activity_level == 'Beginner' %}selected{% endif %}>Beginner</option>
<option value="Intermediate" {% if profile and profile.activity_level == 'Intermediate' %}selected{% endif %}>Intermediate</option>
<option value="Advanced" {% if profile and profile.activity_level == 'Advanced' %}selected{% endif %}>Advanced</option>
</select>
</div>

</div>

<button type="submit" class="save-btn">
Save Profile
</button>

</form>

<a href="{{ url_for('dashboard') }}" class="back-btn">
← Back to Dashboard
</a>

</div>

</div>

</body>
</html>
