<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HealthVerse</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="overlay">

    <div class="login-container">

        <div class="login-box">

            <h1>🌿 HealthVerse</h1>

            <h2>Welcome Back!</h2>

            <p>Login to continue your fitness journey.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash-message {{ category }}" style="background: {% if category == 'success' %}rgba(124, 252, 0, 0.2){% else %}rgba(255, 0, 0, 0.2){% endif %}; border: 1px solid {% if category == 'success' %}rgba(124, 252, 0, 0.4){% else %}rgba(255, 0, 0, 0.4){% endif %}; border-radius: 8px; color: white; padding: 10px; margin-bottom: 15px; font-size: 14px; text-align: center;">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="POST">

                <div class="input-box">
                    <input type="email" name="email" placeholder="Email Address" required>
                </div>

                <div class="input-box">
                    <input type="password" name="password" placeholder="Password" required>
                </div>

                <button type="submit">Login</button>

            </form>

            <div class="register-link">
                Don't have an account?
                <a href="{{ url_for('register') }}">Register</a>
            </div>

            <div class="home-link">
                <a href="{{ url_for('home') }}">← Back to Home</a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
