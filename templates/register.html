<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | HealthVerse</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <div class="register-box">

        <h2>Create Account</h2>

        <p>Join HealthVerse and begin your wellness journey</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-message {{ category }}" style="background: {% if category == 'success' %}rgba(124, 252, 0, 0.2){% else %}rgba(255, 0, 0, 0.2){% endif %}; border: 1px solid {% if category == 'success' %}rgba(124, 252, 0, 0.4){% else %}rgba(255, 0, 0, 0.4){% endif %}; border-radius: 8px; color: white; padding: 10px; margin-bottom: 15px; font-size: 14px; text-align: center;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('register') }}" method="POST">

            <input type="text" name="fullname" placeholder="Full Name" required>

            <input type="email" name="email" placeholder="Email Address" required>

            <input type="password" name="password" placeholder="Password" required>

            <input type="password" name="confirm_password" placeholder="Confirm Password" required>

            <button type="submit">Register</button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </div>

        <div class="login-link">
            <a href="{{ url_for('home') }}">← Back to Home</a>
        </div>

    </div>

</div>

</body>
</html>
